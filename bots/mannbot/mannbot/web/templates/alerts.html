{% extends "base.html" %}{% block title %}Алерты{% endblock %}
{% block body %}<div class="row" style="justify-content:space-between"><h1>Алерты и уведомления</h1>
<form method="post" action="/alerts/ack"><button>Отметить все прочитанными</button></form></div>
<div class="card tw"><table><tr><th>Время</th><th>Уровень</th><th>Код</th><th>Текст</th><th>Заказ</th></tr>
{% for a in rows %}<tr style="{% if a.acknowledged %}opacity:.6{% endif %}"><td style="white-space:nowrap">{{a.ts|ts}}</td><td class="{{a.level}}">{{a.level}}</td><td>{{a.code}}</td><td><pre>{{a.text}}</pre></td>
<td>{% if a.order_id %}<a href="/orders/{{a.order_id}}">#{{a.order_id}}</a>{% endif %}</td></tr>{% else %}<tr><td colspan=5 class="muted">Пусто</td></tr>{% endfor %}</table></div>{% endblock %}
