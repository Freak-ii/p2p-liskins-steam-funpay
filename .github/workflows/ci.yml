name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Центр
        run: python -m pytest -q
      - name: MannBot
        working-directory: bots/mannbot
        run: python -m pytest -q
  lisbot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/lisbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --omit=dev
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resale-center .
      - name: Центр стартует в контейнере и останавливается мягко
        run: |
          docker run -d --name rc -p 127.0.0.1:8800:8800 -e CENTER_SECRET_KEY=ci resale-center python -m center --no-browser --host 0.0.0.0 --demo
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8800/api/ping && break; sleep 2; done
          sleep 10
          docker stop rc
          docker logs rc 2>&1 | tail -20
          docker logs rc 2>&1 | grep -q "Завершение работы центра"
